version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: hatch-sync-redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    container_name: hatch-sync-postgres
    environment:
      POSTGRES_USER: hatch
      POSTGRES_PASSWORD: hatch
      POSTGRES_DB: hatch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hatch -d hatch"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: hatch-sync-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://hatch:hatch@postgres:5432/hatch
      - HATCH_TIMEZONE=America/Los_Angeles
    volumes:
      # Optional: mount service_account.json if present
      - ./service_account.json:/app/service_account.json:ro
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

